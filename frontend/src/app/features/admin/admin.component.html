<p class="eyebrow">TUDO NO SEU LUGAR</p>
<div class="section-title">
  <h1>Gestão da loja</h1>
  <span class="status">{{ roles[auth.user()!.role] }}</span>
</div>
<nav class="management-nav" aria-label="Áreas de gestão">
  <a mat-button routerLink="products" routerLinkActive="active">Produtos</a>
  @if (auth.user()?.role === "ADMIN" || auth.user()?.role === "OWNER") {
    <a mat-button routerLink="companies" routerLinkActive="active">Empresas</a>
  }
  @if (auth.user()?.role === "ADMIN") {
    <a mat-button routerLink="categories" routerLinkActive="active"
      >Categorias</a
    ><a mat-button routerLink="members" routerLinkActive="active">Equipe</a
    ><a mat-button routerLink="coupons" routerLinkActive="active">Cupons</a
    ><a mat-button routerLink="operations" routerLinkActive="active"
      >Pagamento e entrega</a
    >
  }
  <a mat-button routerLink="sales" routerLinkActive="active">Vendas</a>
</nav>
<router-outlet />
