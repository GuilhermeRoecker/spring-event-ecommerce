<div class="section-title">
  <div>
    <h2>Empresas</h2>
    <p class="muted">As lojas que fazem parte da Arôme.</p>
  </div>
  @if (auth.user()?.role === "ADMIN") {
    <button mat-flat-button (click)="edit()">Nova empresa</button>
  }
</div>
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Empresa</th>
        <th>Razão social</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      @for (company of companies(); track company.id) {
        <tr>
          <td>{{ company.name }}</td>
          <td>{{ company.legal_name }}</td>
          <td><button mat-button (click)="edit(company)">Editar</button></td>
        </tr>
      } @empty {
        <tr>
          <td colspan="3">Nenhuma empresa cadastrada.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
