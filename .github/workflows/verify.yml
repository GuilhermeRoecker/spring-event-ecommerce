name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ecommerce_test
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecommerce -d ecommerce_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B verify
        env:
          TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/ecommerce_test
          TEST_POSTGRES_USER: ecommerce
          TEST_POSTGRES_PASSWORD: test-password
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate disposable environment
        run: |
          DB_PASSWORD=$(openssl rand -hex 24)
          ADMIN_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$ADMIN_PASSWORD"
          echo "DB_PASSWORD=$DB_PASSWORD" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_ADMIN_EMAIL=e2e-admin@example.test" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_EMAIL=e2e-admin@example.test" >> "$GITHUB_ENV"
      - run: docker compose up -d --build
      - name: Wait for the API through Nginx
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/products > /dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs app
          exit 1
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
      - run: docker compose down
        if: always()
